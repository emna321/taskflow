<!-- Barre laterale (sidenav) -->
<nav class="sidenav" [class.open]="menuOuvert">
  <a class="brand" routerLink="/dashboard">
    <i class="bi bi-check2-square"></i> Task<span>Flow</span>
  </a>
  <hr />
  <ul class="nav flex-column">
    @for (item of visibleItems; track item.path) {
      <li class="nav-item">
        <a class="nav-link" [routerLink]="item.path" routerLinkActive="active" (click)="menuOuvert = false">
          <i class="bi {{ item.icon }} {{ item.color }}"></i> {{ item.label }}
        </a>
      </li>
    }
  </ul>
  <hr />
  <h6 class="nav-heading">Compte</h6>
  <ul class="nav flex-column">
    <li class="nav-item">
      <a class="nav-link" href="" (click)="$event.preventDefault(); auth.logout()">
        <i class="bi bi-box-arrow-right text-muted"></i> Déconnexion
      </a>
    </li>
  </ul>
</nav>
@if (menuOuvert) { <div class="sidenav-backdrop" (click)="menuOuvert = false"></div> }

<div class="main-content">
  <!-- Navbar superieure -->
  <header class="header bg-gradient-primary">
    <div class="container-fluid px-4">
      <div class="d-flex align-items-center topbar">
        <button class="btn btn-link text-white d-lg-none p-0 me-3 shadow-none" (click)="menuOuvert = !menuOuvert">
          <i class="bi bi-list fs-3"></i>
        </button>
        <h4 class="text-white text-uppercase mb-0 page-title">{{ titre() }}</h4>
        <div class="ms-auto d-flex align-items-center gap-3 user-box">
          @if (auth.currentUser(); as u) {
            <span class="avatar">{{ initiales }}</span>
            <div class="d-none d-md-block lh-sm">
              <div class="text-white fw-semibold">{{ u.prenom }} {{ u.nom }}</div>
              <small class="text-white-50">{{ auth.isAdmin() ? 'Administrateur' : 'Collaborateur' }}</small>
            </div>
            <button class="btn btn-sm btn-neutral" (click)="auth.logout()" title="Déconnexion">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          }
        </div>
      </div>
    </div>
  </header>

  <main class="container-fluid px-4 page-content pb-5">
    <router-outlet />
  </main>
</div>
