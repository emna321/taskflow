spring.application.name=taskflow
# Port 8080 est occupe par le listener HTTP d'Oracle XE (TNSLSNR) sur cette machine : on utilise 8089.
server.port=${SERVER_PORT:8089}

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/taskflow_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Fichiers (pieces jointes, logo, photo) stockes en base =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== JWT =====
# Cle HMAC-SHA256 encodee en Base64 (au moins 256 bits). A CHANGER en production.
app.jwt.secret=${JWT_SECRET:dGFza2Zsb3ctc2VjcmV0LWtleS1lbnNpLWZ1bGxzdGFjay0yMDI2LWNoYW5nZS1tZQ==}
app.jwt.expiration-ms=86400000

# ===== CORS : seul le frontend est autorise =====
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ===== Admin initial (cree au demarrage s'il n'existe pas) =====
app.admin.email=${ADMIN_EMAIL:admin@taskflow.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ===== Email (Gmail : utiliser un "mot de passe d'application") =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}
