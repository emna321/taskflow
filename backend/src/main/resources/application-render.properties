# ===== Profil "render" : deploiement sur Render.com avec une base PostgreSQL =====
# Active ce profil avec SPRING_PROFILES_ACTIVE=render (Render ne conserve pas le disque :
# les fichiers (pieces jointes, logo, photo) sont donc stockes en base, pas sur le filesystem).

# Render fournit en general une seule variable DATABASE_URL au format postgres://user:pass@host:port/db
# qu'il faut reformater en URL JDBC : jdbc:postgresql://host:port/db (voir deploy/render-start.sh).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskflow_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
