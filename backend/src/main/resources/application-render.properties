# ===== Profil "render" : deploiement sur Render.com avec une base PostgreSQL =====
# Render impose le port d'ecoute via la variable PORT.
server.port=${PORT:8080}

# Active ce profil avec SPRING_PROFILES_ACTIVE=render (Render ne conserve pas le disque :
# les fichiers (pieces jointes, logo, photo) sont donc stockes en base, pas sur le filesystem).

# Render donne l'hote, le port, le nom de la base, l'utilisateur et le mot de passe separement
# (voir render.yaml) : l'URL JDBC est reconstruite ici. SPRING_DATASOURCE_URL reste prioritaire si definie.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow_db}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
